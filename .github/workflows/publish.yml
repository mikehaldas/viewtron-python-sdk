# Publish viewtron to PyPI with trusted publishing (no API token).
# Runs when a GitHub release is published, or by hand for an existing tag.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.3.1"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: viewtron-python-sdk
          persist-credentials: false

      # tests/test_events.py reads XML fixtures from ../IP-Camera-API/examples
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikehaldas/IP-Camera-API
          path: IP-Camera-API
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: viewtron-python-sdk
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install .
          python -m pytest -q tests

      - name: Build
        working-directory: viewtron-python-sdk
        run: python -m build

      - name: Check built version matches the release tag
        working-directory: viewtron-python-sdk
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not in vX.Y.Z form"; exit 1
          fi
          VERSION="${TAG#v}"
          ls dist
          if [ ! -f "dist/viewtron-$VERSION-py3-none-any.whl" ] || [ ! -f "dist/viewtron-$VERSION.tar.gz" ]; then
            echo "::error::Built files do not match tag $TAG (expected version $VERSION)"; exit 1
          fi
          if [ "$(find dist -type f | wc -l)" -ne 2 ]; then
            echo "::error::Unexpected files in dist/"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: viewtron-python-sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viewtron
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
